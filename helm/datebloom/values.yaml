# Default values for the datebloom chart.

replicaCount: 2

image:
  # Where CI pushes the image built from the repo Dockerfile. Override per registry.
  repository: ghcr.io/markmorcos/datebloom
  # Defaults to the chart's appVersion when left empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    # Assumes cert-manager + a ClusterIssuer named "letsencrypt-prod".
    # Remove/change if you terminate TLS elsewhere.
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: datewithmark.com
      paths:
        - path: /
          pathType: Prefix
    - host: www.datewithmark.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: datebloom-tls
      hosts:
        - datewithmark.com
        - www.datewithmark.com

# Static nginx — tiny footprint.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
